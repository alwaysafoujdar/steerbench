name: full
experiments:
- E0
- TUNE
- TUNE_RL
- TUNE_OFFLINE
- TRAIN
- TRAIN_OFFLINE
- E1
- E2
- E2X
- E3
- E4
- E5
results_dir: results
figures_dir: figures
machine:
  lattice:
    n_cells: 10
    drift_length: 5.0
    phase_advance_deg: 90.0
  errors:
    focal_error_sigma: 0.03
    bpm_gain_sigma: 0.01
    corrector_gain_sigma: 0.01
    quad_misalignment_mm: 0.1
    injection_offset_mm: 0.5
    injection_angle_mrad: 0.05
  measurement:
    bpm_noise_mm: 0.05
    masked_fraction: 0.0
  limits:
    theta_max_mrad: 0.2
    dtheta_max_mrad: 0.2
  drift:
    focal_error_sigma: 0.0
    bpm_gain_sigma: 0.0
    corrector_gain_sigma: 0.0
    quad_misalignment_mm: 0.0
    injection_offset_mm: 0.0
    injection_angle_mrad: 0.0
eval:
  n_test_machines: 50
  n_val_machines: 20
  test_seed: 1000
  val_seed: 2000
  train_seed: 3000
  oracle_seed: 4000
  max_interactions: 30
  success_threshold: 0.05
  n_bootstrap: 1000
  n_oracle_check: 1000
env:
  horizon: 15
  rms_threshold_mm: 0.05
  limit_penalty: 0.01
  action_scale_mrad: null
  x_scale_mm: 1.0
  obs_clip: 10.0
randomisation:
  focal_error_sigma:
  - 0.0
  - 0.1
  masked_fraction:
  - 0.0
  - 0.4
rl:
  algorithms:
  - SAC
  - TD3
  total_steps: 100000
  n_seeds: 5
  learning_rate: 0.0003
  gamma: 0.95
  batch_size: 256
  tau: 0.005
  buffer_size: 100000
  learning_starts: 1000
  net_arch:
  - 256
  - 256
  action_scale_mrad: 0.02
  td3_action_noise: 0.1
  n_jobs: 8
offline:
  algorithms:
  - BC
  - TD3+BC
  behaviour_gain: 0.5
  behaviour_noise_mrad: 0.02
  dataset_sizes:
  - 10000
  - 50000
  n_steps: 20000
  n_seeds: 5
  gamma: 0.95
  action_scale_mrad: null
  learning_rate: 0.0003
  alpha: 2.5
  e5_sizes:
  - 10000
  - 50000
  e5_noises:
  - 0.005
  - 0.02
  - 0.05
  e5_seeds: 3
drift:
  n_episodes: 200
  n_machines: 5
  budget: 15
  rates:
    focal_error_sigma: 0.007
    bpm_gain_sigma: 0.001
    corrector_gain_sigma: 0.001
    quad_misalignment_mm: 0.005
    injection_offset_mm: 0.02
    injection_angle_mrad: 0.002
  finetune_gradient_steps: 50
tuning:
  n_trials: 6
  seed: 5000
